name: BTC每日估值推送

on:
  schedule:
    # 每天北京时间 21:08 自动推送 → UTC 时间 13:08
    - cron: "8 13 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: pip install requests

      - name: 运行 BTC 推送脚本
        run: python btc_monitor.py
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
